<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090909" />
  <title>Axiom</title>
  <link rel="icon" type="image/png" href="favicon-32.png" />
  <style>
    :root {
      --canvas: #090909;
      --surface-1: #141414;
      --hairline: #262626;
      --ink: #ffffff;
      --ink-muted: #999999;
      --accent-blue: #0099ff;
      --violet: #6a4cf5;
      --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    ::selection {
      background: var(--accent-blue);
      color: var(--ink);
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      background: var(--canvas);
      color: var(--ink);
      font-family: Menlo, 'DejaVu Sans Mono', Consolas, monospace;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: grid;
      place-items: center;
    }

    .bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .blob {
      position: absolute;
      width: 70vmax;
      height: 70vmax;
      border-radius: 50%;
      opacity: 0.18;
      will-change: transform;
    }

    .blob-violet {
      top: -35vmax;
      left: -25vmax;
      background: radial-gradient(circle, var(--violet), transparent 65%);
      animation: drift-a 22s ease-in-out infinite alternate;
    }

    .blob-orange {
      right: -30vmax;
      bottom: -40vmax;
      background: radial-gradient(circle, #ff5577, transparent 65%);
      opacity: 0.12;
      animation: drift-b 28s ease-in-out infinite alternate;
    }

    main {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 1.5rem;
      text-align: center;
    }

    .tile {
      position: relative;
      width: 128px;
      height: 128px;
      opacity: 0;
      animation: rise 1s var(--ease) 0.1s forwards;
    }

    .glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 220px;
      height: 220px;
      overflow: visible;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .tile img {
      position: relative;
      width: 100%;
      height: 100%;
      animation: float 5s ease-in-out infinite;
    }

    h1 {
      margin-top: 3rem;
      font-size: clamp(3rem, 14vw, 8.5rem);
      font-weight: 500;
      line-height: 0.95;
      letter-spacing: -0.06em;
      opacity: 0;
      animation: rise 1s var(--ease) 0.3s forwards;
    }

    .caption {
      margin-top: 1.75rem;
      font-size: 0.9375rem;
      letter-spacing: -0.01em;
      color: var(--ink-muted);
      opacity: 0;
      animation: rise 1s var(--ease) 0.5s forwards;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.625rem;
      margin-top: 2.5rem;
      min-height: 36px;
      padding: 0.375rem 1rem;
      border-radius: 100px;
      background: var(--surface-1);
      box-shadow: 0 0 0 1px var(--hairline);
      color: var(--ink);
      text-decoration: none;
      font-size: 0.8125rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      opacity: 0;
      animation: rise 1s var(--ease) 0.7s forwards;
      transition: transform 0.15s var(--ease), background-color 0.15s;
    }

    .pill:hover {
      background: #1c1c1c;
    }

    .pill:active {
      transform: scale(0.96);
    }

    .pill svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes drift-a {
      to { transform: translate3d(30vmax, 22vmax, 0) scale(1.15); }
    }

    @keyframes drift-b {
      to { transform: translate3d(-32vmax, -18vmax, 0) scale(1.2); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        opacity: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="blob blob-violet"></div>
    <div class="blob blob-orange"></div>
  </div>

  <main>
    <div class="tile">
      <svg class="glow" viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <filter id="glow-blur" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="14" />
          </filter>
        </defs>
        <polygon id="glow-shape" fill="#6a4cf5" fill-opacity="0.35" filter="url(#glow-blur)" />
      </svg>
      <img src="icon-256.png" alt="" width="128" height="128" />
    </div>

    <h1>Axiom</h1>
    <p class="caption">Agent orchestration system</p>

    <a class="pill" href="https://github.com/uonick/axiom/releases/latest" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z" />
      </svg>
      <span>Download beta</span>
    </a>
  </main>
  <script>
    const shape = document.getElementById('glow-shape')
    const corners = [
      { x: 78, y: 36, ax: 16, ay: 12, fx: 0.55, fy: 0.35, px: 0.4, py: 1.7 },
      { x: 158, y: 52, ax: 12, ay: 18, fx: 0.4, fy: 0.62, px: 2.1, py: 0.6 },
      { x: 172, y: 128, ax: 14, ay: 14, fx: 0.7, fy: 0.42, px: 1.2, py: 2.4 },
      { x: 124, y: 176, ax: 18, ay: 10, fx: 0.33, fy: 0.58, px: 2.8, py: 1.1 },
      { x: 42, y: 162, ax: 12, ay: 16, fx: 0.48, fy: 0.36, px: 0.9, py: 2.9 },
      { x: 28, y: 78, ax: 16, ay: 12, fx: 0.62, fy: 0.5, px: 1.8, py: 0.3 },
    ]

    const draw = (time) => {
      const seconds = time / 1000
      shape.setAttribute('points', corners.map((corner) => {
        const x = corner.x + Math.sin(seconds * corner.fx + corner.px) * corner.ax
        const y = corner.y + Math.sin(seconds * corner.fy + corner.py) * corner.ay
        return x.toFixed(1) + ',' + y.toFixed(1)
      }).join(' '))
    }

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      draw(0)
    } else {
      const tick = (time) => {
        draw(time)
        requestAnimationFrame(tick)
      }
      requestAnimationFrame(tick)
    }
  </script>
</body>
</html>
