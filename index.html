<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090909" />
  <title>Axiom</title>
  <link rel="icon" type="image/png" href="favicon-32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --canvas: #090909;
      --surface-1: #141414;
      --hairline: #262626;
      --ink: #ffffff;
      --ink-muted: #999999;
      --accent-blue: #0099ff;
      --violet: #6a4cf5;
      --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    ::selection {
      background: var(--accent-blue);
      color: var(--ink);
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      background: var(--canvas);
      color: var(--ink);
      font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: grid;
      place-items: center;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 1.5rem;
      text-align: center;
    }

    .tile {
      position: relative;
      width: 128px;
      height: 128px;
      opacity: 0;
      animation: rise 1s var(--ease) 0.1s forwards;
    }

    .tile::before {
      content: '';
      position: absolute;
      inset: -24px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--violet), transparent 65%);
      opacity: 0.35;
      animation: glow 4s ease-in-out infinite;
    }

    .tile img {
      position: relative;
      width: 100%;
      height: 100%;
      animation: float 5s ease-in-out infinite;
    }

    h1 {
      margin-top: 3rem;
      font-size: clamp(3rem, 14vw, 8.5rem);
      font-weight: 500;
      line-height: 0.95;
      letter-spacing: -0.06em;
      opacity: 0;
      animation: rise 1s var(--ease) 0.3s forwards;
    }

    .caption {
      margin-top: 1.75rem;
      font-size: 0.9375rem;
      letter-spacing: -0.01em;
      color: var(--ink-muted);
      opacity: 0;
      animation: rise 1s var(--ease) 0.5s forwards;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.625rem;
      margin-top: 2.5rem;
      padding: 0.625rem 1rem;
      border-radius: 100px;
      background: var(--surface-1);
      box-shadow: 0 0 0 1px var(--hairline);
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      opacity: 0;
      animation: rise 1s var(--ease) 0.7s forwards;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ink);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes glow {
      0%, 100% { opacity: 0.2; transform: scale(0.95); }
      50% { opacity: 0.5; transform: scale(1.05); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.25; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        opacity: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="tile">
      <img src="icon-256.png" alt="" width="128" height="128" />
    </div>

    <h1>Axiom</h1>
    <p class="caption">Something has begun</p>

    <div class="pill">
      <span class="dot"></span>
      <span>Coming soon</span>
    </div>
  </main>
</body>
</html>
