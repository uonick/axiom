<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090909" />
  <title>Axiom</title>
  <link rel="icon" type="image/png" href="img/favicon-32.png" />
  <style>
    :root {
      --canvas: #090909;
      --surface-1: #141414;
      --hairline: #262626;
      --ink: #ffffff;
      --ink-muted: #999999;
      --accent-blue: #0099ff;
      --violet: #6a4cf5;
      --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    ::selection {
      background: var(--accent-blue);
      color: var(--ink);
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      background: var(--canvas);
      color: var(--ink);
      font-family: Menlo, 'DejaVu Sans Mono', Consolas, monospace;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: grid;
      grid-template-rows: minmax(50%, auto) 1fr;
    }

    .shot {
      position: relative;
      z-index: 2;
      grid-row: 2;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: hidden;
      padding: 0 1.5rem;
      opacity: 0;
      animation: rise 1.2s var(--ease) 0.9s forwards;
    }

    .shot__frame {
      width: 100%;
      min-width: 0;
    }

    .shot__image {
      display: block;
      width: 100%;
      max-width: 1600px;
      height: auto;
      margin-inline: auto;
      animation: float 6s ease-in-out infinite;
    }

    .backdrop {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .backdrop__blob {
      position: absolute;
      width: 70vmax;
      height: 70vmax;
      border-radius: 50%;
      opacity: 0.18;
      will-change: transform;
    }

    .backdrop__blob_violet {
      top: -35vmax;
      left: -25vmax;
      background: radial-gradient(circle, var(--violet), transparent 65%);
      animation: drift-a 22s ease-in-out infinite alternate;
    }

    .backdrop__blob_orange {
      right: -30vmax;
      bottom: -40vmax;
      background: radial-gradient(circle, #ff5577, transparent 65%);
      opacity: 0.12;
      animation: drift-b 28s ease-in-out infinite alternate;
    }

    .glass-filter {
      position: absolute;
      pointer-events: none;
    }

    .grain {
      position: fixed;
      top: -96px;
      left: -96px;
      z-index: 1;
      width: calc(100% + 192px);
      height: calc(100% + 192px);
      background-size: 192px 192px;
      opacity: 0.07;
      pointer-events: none;
      will-change: transform;
      animation: grain 0.5s steps(1) infinite;
    }

    .hero {
      position: relative;
      z-index: 2;
      grid-row: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      text-align: center;
    }

    .hero__logo {
      position: relative;
      width: clamp(72px, 12vh, 128px);
      height: clamp(72px, 12vh, 128px);
      opacity: 0;
      animation: rise 1s var(--ease) 0.1s forwards;
    }

    .hero__glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 220px;
      height: 220px;
      overflow: visible;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .hero__icon {
      position: relative;
      width: 100%;
      height: 100%;
      animation: float 5s ease-in-out infinite;
    }

    .hero__title {
      margin-top: clamp(1.25rem, 4vh, 3rem);
      font-size: clamp(1.65rem, min(8.4vw, 7.8vh), 5.1rem);
      font-weight: 500;
      line-height: 0.95;
      letter-spacing: -0.06em;
      opacity: 0;
      animation: rise 1s var(--ease) 0.3s forwards;
    }

    .hero__caption {
      margin-top: clamp(1rem, 2.5vh, 1.75rem);
      font-size: 0.9375rem;
      letter-spacing: -0.01em;
      color: var(--ink-muted);
      opacity: 0;
      animation: rise 1s var(--ease) 0.5s forwards;
    }

    .hero__download {
      position: relative;
      isolation: isolate;
      display: inline-flex;
      align-items: center;
      gap: 0.625rem;
      margin-top: clamp(1.25rem, 4vh, 2.5rem);
      min-height: 48px;
      padding: 0.5rem 1.75rem;
      border-radius: 100px;
      background: rgba(255, 255, 255, 0.07);
      -webkit-backdrop-filter: blur(8px) saturate(180%) brightness(1.15);
      backdrop-filter: blur(8px) saturate(180%) brightness(1.15);
      box-shadow:
        inset 1.5px 1.5px 0.5px -0.5px rgba(255, 255, 255, 0.6),
        inset -1.5px -1.5px 0.5px -0.5px rgba(255, 255, 255, 0.32),
        inset 0 0 0 1px rgba(255, 255, 255, 0.08),
        inset 0 8px 16px -8px rgba(255, 255, 255, 0.28),
        inset 0 -8px 16px -10px rgba(255, 255, 255, 0.12),
        0 10px 32px rgba(0, 0, 0, 0.4);
      color: var(--ink);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      opacity: 0;
      animation: rise 1s var(--ease) 0.7s forwards;
      transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease), background-color 0.25s;
    }

    .hero__download::before,
    .hero__download::after {
      content: '';
      position: absolute;
      pointer-events: none;
      border-radius: inherit;
    }

    .hero__download::before {
      inset: 0;
      padding: 1px;
      background: linear-gradient(140deg, rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0) 30%, rgba(255, 255, 255, 0) 70%, rgba(255, 255, 255, 0.6));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    }

    .hero__download::after {
      top: 3px;
      right: 18%;
      left: 18%;
      height: 38%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0));
    }

    .hero__download > * {
      position: relative;
      z-index: 1;
    }

    .hero__download:hover {
      background-color: rgba(255, 255, 255, 0.12);
    }

    .hero__download:active {
      transform: scale(0.96);
    }

    .hero__mark {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes drift-a {
      to { transform: translate3d(30vmax, 22vmax, 0) scale(1.15); }
    }

    @keyframes drift-b {
      to { transform: translate3d(-32vmax, -18vmax, 0) scale(1.2); }
    }

    @keyframes grain {
      0% { transform: translate3d(0, 0, 0); }
      10% { transform: translate3d(-53px, 31px, 0); }
      20% { transform: translate3d(41px, -67px, 0); }
      30% { transform: translate3d(-79px, -23px, 0); }
      40% { transform: translate3d(63px, 52px, 0); }
      50% { transform: translate3d(-17px, 83px, 0); }
      60% { transform: translate3d(71px, -41px, 0); }
      70% { transform: translate3d(-61px, -71px, 0); }
      80% { transform: translate3d(29px, 19px, 0); }
      90% { transform: translate3d(-37px, 59px, 0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
      }

      .hero__logo,
      .hero__title,
      .hero__caption,
      .hero__download,
      .shot {
        opacity: 1 !important;
      }
    }
  </style>
</head>
<body>
  <svg class="glass-filter" width="0" height="0" aria-hidden="true" focusable="false">
    <filter id="liquid-glass" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
      <feImage id="glass-map" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="map" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" result="soft" />
      <feDisplacementMap id="glass-displace" in="soft" in2="map" scale="28" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>
  <div class="backdrop" aria-hidden="true">
    <div class="backdrop__blob backdrop__blob_violet"></div>
    <div class="backdrop__blob backdrop__blob_orange"></div>
  </div>

  <main class="hero">
    <div class="hero__logo">
      <svg class="hero__glow" viewBox="0 0 200 200" aria-hidden="true">
        <defs>
          <filter id="glow-blur" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="14" />
          </filter>
        </defs>
        <polygon id="glow-shape" fill="#6a4cf5" fill-opacity="0.35" filter="url(#glow-blur)" />
      </svg>
      <img class="hero__icon" src="img/icon-256.png" alt="" width="128" height="128" />
    </div>

    <h1 class="hero__title">Axiom</h1>
    <p class="hero__caption">Agent orchestration system</p>

    <a class="hero__download" href="https://github.com/uonick/axiom/releases/latest" target="_blank" rel="noopener noreferrer">
      <svg class="hero__mark" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z" />
      </svg>
      <span>Download beta</span>
    </a>
  </main>

  <div class="grain" aria-hidden="true"></div>

  <div class="shot">
    <picture class="shot__frame">
      <source media="(min-width: 800px) and (min-resolution: 2dppx)" srcset=".generated/screenshot-2104.webp" />
      <source media="(min-width: 800px)" srcset=".generated/screenshot-1600.webp" />
      <source media="(min-resolution: 2dppx)" srcset=".generated/screenshot-1024.webp" />
      <img class="shot__image" src=".generated/screenshot-640.webp" alt="Axiom app screenshot" width="2104" height="1232" />
    </picture>
  </div>
  <script>
    const shape = document.getElementById('glow-shape')
    const corners = [
      { x: 78, y: 36, ax: 16, ay: 12, fx: 0.55, fy: 0.35, px: 0.4, py: 1.7 },
      { x: 158, y: 52, ax: 12, ay: 18, fx: 0.4, fy: 0.62, px: 2.1, py: 0.6 },
      { x: 172, y: 128, ax: 14, ay: 14, fx: 0.7, fy: 0.42, px: 1.2, py: 2.4 },
      { x: 124, y: 176, ax: 18, ay: 10, fx: 0.33, fy: 0.58, px: 2.8, py: 1.1 },
      { x: 42, y: 162, ax: 12, ay: 16, fx: 0.48, fy: 0.36, px: 0.9, py: 2.9 },
      { x: 28, y: 78, ax: 16, ay: 12, fx: 0.62, fy: 0.5, px: 1.8, py: 0.3 },
    ]

    const draw = (time) => {
      const seconds = time / 1000
      shape.setAttribute('points', corners.map((corner) => {
        const x = corner.x + Math.sin(seconds * corner.fx + corner.px) * corner.ax
        const y = corner.y + Math.sin(seconds * corner.fy + corner.py) * corner.ay
        return x.toFixed(1) + ',' + y.toFixed(1)
      }).join(' '))
    }

    const glassButton = document.querySelector('.hero__download')
    const glassMap = document.getElementById('glass-map')
    const glassDisplace = document.getElementById('glass-displace')
    const glassBezel = 20
    const glassShift = 14

    const buildGlassMap = (width, height) => {
      const canvas = document.createElement('canvas')
      canvas.width = width
      canvas.height = height
      const context = canvas.getContext('2d')
      const image = context.createImageData(width, height)
      const pixels = image.data
      const radius = height / 2
      const halfCore = Math.max(width / 2 - radius, 0)
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const px = x + 0.5 - width / 2
          const py = y + 0.5 - height / 2
          const coreX = Math.max(-halfCore, Math.min(halfCore, px))
          const offsetX = px - coreX
          const length = Math.hypot(offsetX, py) || 1
          const depth = radius - length
          let shiftX = 0
          let shiftY = 0
          if (depth >= 0 && depth < glassBezel) {
            const strength = Math.pow(1 - depth / glassBezel, 2.2)
            shiftX = (-offsetX / length) * strength
            shiftY = (-py / length) * strength
          }
          const offset = (y * width + x) * 4
          pixels[offset] = 128 + shiftX * 127
          pixels[offset + 1] = 128 + shiftY * 127
          pixels[offset + 2] = 128
          pixels[offset + 3] = 255
        }
      }
      context.putImageData(image, 0, 0)
      return canvas.toDataURL('image/png')
    }

    const applyLiquidGlass = () => {
      const width = Math.round(glassButton.offsetWidth)
      const height = Math.round(glassButton.offsetHeight)
      glassMap.setAttribute('href', buildGlassMap(width, height))
      glassDisplace.setAttribute('scale', String(glassShift * 2))
      glassButton.style.backdropFilter = 'url(#liquid-glass) blur(2px) saturate(190%) brightness(1.2)'
      if (!getComputedStyle(glassButton).backdropFilter.includes('url(')) {
        glassButton.style.backdropFilter = ''
      }
    }

    applyLiquidGlass()
    new ResizeObserver(applyLiquidGlass).observe(glassButton)

    const buildGrainTile = (size) => {
      const tile = document.createElement('canvas')
      tile.width = size
      tile.height = size
      const context = tile.getContext('2d')
      const image = context.createImageData(size, size)
      const pixels = image.data
      for (let index = 0; index < pixels.length; index += 4) {
        const tone = Math.random() * 255
        pixels[index] = Math.min(255, tone + 40)
        pixels[index + 1] = tone * 0.75
        pixels[index + 2] = tone * 0.45
        pixels[index + 3] = Math.random() * 255
      }
      context.putImageData(image, 0, 0)
      return tile.toDataURL('image/png')
    }

    document.querySelector('.grain').style.backgroundImage = 'url(' + buildGrainTile(192) + ')'

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      draw(0)
    } else {
      const tick = (time) => {
        draw(time)
        requestAnimationFrame(tick)
      }
      requestAnimationFrame(tick)
    }
  </script>
</body>
</html>
